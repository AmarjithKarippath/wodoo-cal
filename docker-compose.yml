services:
  wodoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wodoo-waitlist
    restart: unless-stopped
    ports:
      - "3015:3015"
    environment:
      NODE_ENV: production
      PORT: 3015
      HOSTNAME: 0.0.0.0
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
      WAITLIST_BASE_COUNT: ${WAITLIST_BASE_COUNT:-2400}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3015}
    volumes:
      - wodoo_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3015').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  wodoo_data:
    name: wodoo_waitlist_data
